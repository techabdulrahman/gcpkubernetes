apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-k8s-demo
  namespace: ai-troubleshooter
  labels:
    app: ai-k8s-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-k8s-demo

  template:
    metadata:
      labels:
        app: ai-k8s-demo

    spec:
      containers:
        - name: ai-k8s-demo
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: APP_NAME
              value: "AI Kubernetes Troubleshooter Demo"

            - name: APP_VERSION
              value: "1.0.0"

            - name: ENVIRONMENT
              value: "production"

            - name: PORT
              value: "8080"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5