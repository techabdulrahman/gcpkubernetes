apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-k8s-demo
  namespace: ai-troubleshooter
  labels:
    app: ai-k8s-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ai-k8s-demo

  template:
    metadata:
      labels:
        app: ai-k8s-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scheme: http

    spec:
      containers:
        - name: ai-k8s-demo
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: APP_NAME
              value: "AI Kubernetes Troubleshooter Demo"

            - name: APP_VERSION
              value: "1.0.0"

            - name: ENVIRONMENT
              value: "production"

            - name: PORT
              value: "8080"

            - name: GRAFANA_PROM_URL
              valueFrom:
                secretKeyRef:
                  name: ai-troubleshooter-runtime
                  key: GRAFANA_PROM_URL
                  optional: true

            - name: GRAFANA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-troubleshooter-runtime
                  key: GRAFANA_USERNAME
                  optional: true

            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-troubleshooter-runtime
                  key: GRAFANA_TOKEN
                  optional: true

            - name: GRAFANA_CLUSTER
              valueFrom:
                secretKeyRef:
                  name: ai-troubleshooter-runtime
                  key: GRAFANA_CLUSTER
                  optional: true

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-troubleshooter-runtime
                  key: GEMINI_API_KEY
                  optional: true

            - name: GEMINI_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-troubleshooter-runtime
                  key: GEMINI_MODEL
                  optional: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
