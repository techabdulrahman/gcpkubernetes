apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-investigation-reader
  namespace: ai-troubleshooter
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-investigation-reader
  namespace: ai-troubleshooter
subjects:
  - kind: User
    name: INVESTIGATION_SERVICE_ACCOUNT_EMAIL
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-sre-investigation-reader
