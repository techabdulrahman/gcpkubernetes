apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-sre-remediation-operator
  namespace: ai-troubleshooter
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["ai-k8s-service"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ai-k8s-demo"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-sre-remediation-operator
  namespace: ai-troubleshooter
subjects:
  - kind: User
    name: REMEDIATION_SERVICE_ACCOUNT_EMAIL
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-sre-remediation-operator
