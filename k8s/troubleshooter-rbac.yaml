apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-k8s-troubleshooter-reader
  namespace: ai-troubleshooter
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-k8s-troubleshooter-reader
  namespace: ai-troubleshooter
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ai-troubleshooter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-k8s-troubleshooter-reader
