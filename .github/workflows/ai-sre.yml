name: AI SRE - read-only report

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ai-sre
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      INVESTIGATION_SERVICE_ACCOUNT: ${{ vars.GCP_INVESTIGATION_SERVICE_ACCOUNT }}
      INCIDENT_NAMESPACE: ${{ vars.INCIDENT_NAMESPACE || 'ai-troubleshooter' }}
      INCIDENT_WORKLOAD: ${{ vars.INCIDENT_WORKLOAD || 'ai-k8s-demo' }}
      EVIDENCE_FILE: ${{ runner.temp }}/incident-evidence.json
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GRAFANA_PROM_URL: ${{ secrets.GRAFANA_PROM_URL }}
      GRAFANA_USERNAME: ${{ secrets.GRAFANA_USERNAME }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_CLUSTER: ${{ vars.GRAFANA_CLUSTER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Validate read-only investigation configuration
        shell: bash
        run: |
          for value in PROJECT_ID REGION CLUSTER_NAME WIF_PROVIDER INVESTIGATION_SERVICE_ACCOUNT; do
            if [ -z "${!value}" ]; then
              echo "::error::Required repository variable $value is not configured."
              exit 1
            fi
          done

      - name: Authenticate as the read-only investigation identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INVESTIGATION_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: Collect evidence and write a report without mutations
        run: python scripts/ai_sre_auto.py

      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-evidence
          path: ${{ runner.temp }}/incident-evidence.json
          retention-days: 7
          if-no-files-found: ignore
