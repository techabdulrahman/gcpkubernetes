name: AI SRE Kubernetes Investigation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy AI Kubernetes Demo to GKE
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-sre-kubernetes-investigation
  cancel-in-progress: false

jobs:
  investigate:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      INVESTIGATION_SERVICE_ACCOUNT: ${{ vars.GCP_INVESTIGATION_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      INCIDENT_NAMESPACE: ${{ vars.INCIDENT_NAMESPACE || 'ai-troubleshooter' }}
      INCIDENT_WORKLOAD: ${{ vars.INCIDENT_WORKLOAD || 'ai-k8s-demo' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GRAFANA_PROM_URL: ${{ secrets.GRAFANA_PROM_URL }}
      GRAFANA_USERNAME: ${{ secrets.GRAFANA_USERNAME }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_CLUSTER: ${{ vars.GRAFANA_CLUSTER }}
    steps:
      - name: Check out trusted investigation code
        uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Retrieve the triggering deployment run metadata
        id: source_lookup
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const expectedRepository = `${owner}/${repo}`;
            const fields = [
              "id",
              "repository",
              "head_repository",
              "head_branch",
              "event",
              "status",
              "conclusion",
            ];
            const apiFields = [...fields, "path", "created_at"];
            const selectFields = (value, selectedFields) => value
              ? Object.fromEntries(selectedFields.map(field => [
                field,
                ["repository", "head_repository"].includes(field)
                  ? value[field] && { full_name: value[field].full_name }
                  : value[field],
              ]))
              : null;
            core.setOutput("source_run", JSON.stringify(selectFields(source, fields)));
            if (!Number.isSafeInteger(source?.id) || source.id < 1) {
              core.setOutput("api_run", "null");
              return;
            }
            try {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: source.id,
              });
              core.setOutput("api_run", JSON.stringify(selectFields(run, apiFields)));
            } catch (error) {
              core.error(`Deployment lookup failed: repository=${expectedRepository}, run_id=${source.id}, HTTP=${error.status || "unknown"}.`);
              core.setFailed("The triggering deployment run could not be verified.");
            }

      - name: Validate the exact failed deployment run
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          SOURCE_RUN_JSON: ${{ steps.source_lookup.outputs.source_run }}
          API_RUN_JSON: ${{ steps.source_lookup.outputs.api_run }}
        run: python scripts/validate_deployment_run.py

      - name: Validate read-only investigation configuration
        shell: bash
        run: |
          for value in PROJECT_ID REGION CLUSTER_NAME WIF_PROVIDER INVESTIGATION_SERVICE_ACCOUNT; do
            if [ -z "${!value}" ]; then
              echo "::error::Required repository variable $value is not configured."
              exit 1
            fi
          done

      - name: Authenticate as the read-only investigation identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.INVESTIGATION_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect read-only incident evidence
        run: python scripts/investigate_kubernetes.py collect --input "$RUNNER_TEMP/incident-evidence.json"

      - name: Preserve bounded incident evidence for trusted automatic remediation
        uses: actions/upload-artifact@v4
        with:
          name: incident-evidence
          path: ${{ runner.temp }}/incident-evidence.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: investigate
    if: ${{ needs.investigate.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out trusted report publisher
        uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Download this run's incident evidence
        uses: actions/download-artifact@v4
        with:
          name: incident-evidence
          path: ${{ runner.temp }}/incident-evidence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish or update deduplicated incident reports
        run: python scripts/investigate_kubernetes.py publish --input "$RUNNER_TEMP/incident-evidence/incident-evidence.json"
