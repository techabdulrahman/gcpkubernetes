name: Deploy AI Kubernetes Demo to GKE

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE_NAME: ai-k8s-demo
  NAMESPACE: ai-troubleshooter
  DEPLOYMENT_NAME: ai-k8s-demo

jobs:
  deploy:
    name: Build and deploy to GKE
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          for value in PROJECT_ID REGION CLUSTER_NAME GAR_REPOSITORY; do
            if [ -z "${!value}" ]; then
              echo "::error::The GitHub repository variable for $value is not set."
              exit 1
            fi
          done


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/807744285814/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@abdulproject-510307.iam.gserviceaccount.com


      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push Docker image
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker build --tag "${IMAGE_URI}" .
          IMAGE_DIGEST="$(docker push --quiet "${IMAGE_URI}")"
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker did not return a valid immutable image digest."
            exit 1
          fi
          IMAGE_REF="${IMAGE_URI}@${IMAGE_DIGEST}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment image"
            echo "- Commit: \`${IMAGE_TAG}\`"
            echo "- Published tag: \`${IMAGE_URI}\`"
            echo "- Deployed immutable image: \`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}

      - name: Deploy manifests
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_REF}|g" k8s/deployment.yaml > "${RUNNER_TEMP}/deployment.yaml"
          if grep -q "IMAGE_PLACEHOLDER" "${RUNNER_TEMP}/deployment.yaml"; then
            echo "::error::The deployment image placeholder was not replaced."
            exit 1
          fi
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f "${RUNNER_TEMP}/deployment.yaml"
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment rollout
        run: kubectl rollout status "deployment/${DEPLOYMENT_NAME}" --namespace "${NAMESPACE}" --timeout=180s

      - name: Display pods and service
        run: |
          kubectl get pods --namespace "${NAMESPACE}" -o wide
          kubectl get service --namespace "${NAMESPACE}"

      - name: Show troubleshooting details on failure
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl get pods --namespace "${NAMESPACE}" -o wide || true
          echo "::endgroup::"
          echo "::group::Deployment"
          kubectl describe deployment "${DEPLOYMENT_NAME}" --namespace "${NAMESPACE}" || true
          echo "::endgroup::"
          echo "::group::Pod events"
          kubectl get events --namespace "${NAMESPACE}" --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::Recent application logs"
          kubectl logs --namespace "${NAMESPACE}" -l app=ai-k8s-demo --all-containers=true --tail=100 || true
          echo "::endgroup::"
